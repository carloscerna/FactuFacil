{# views/personal/Personal.html #}
{% extends 'default_layout.html' %}

{% block contenidos %}
<div class="container mt-5">
    <div class="card shadow-lg rounded-3">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center rounded-top-3">
            <h2 class="mb-0">Gestión de Personal</h2>
            <button class="btn btn-light" id="btnNuevoPersonal" type="button" data-bs-toggle="modal" data-bs-target="#personalModal">
                <i class="fas fa-plus-circle me-2"></i> Nuevo Registro
            </button>
        </div>
        <div class="card-body p-4">
            <table id="tablaPersonal" class="table table-striped table-hover table-bordered">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombres</th>
                        <th>Apellidos</th>
                        <th>DUI</th>
                        <th>Teléfono</th>
                        <th>Cargo</th>
                        <th>Estatus</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="personalModal" tabindex="-1" aria-labelledby="personalModalLabel">
    <div class="modal-dialog modal-xl">
        <div class="modal-content rounded-4 shadow-lg">
            <div class="modal-header bg-primary text-white rounded-top-4">
                <h5 class="modal-title" id="personalModalLabel">Formulario de Personal</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <form id="personalForm">
                    <input type="hidden" id="id_personal" name="id_personal">
                    <input type="hidden" name="accion" value="crearActualizar">

                    <div class="row">
                        <div class="col-md-6 mb-3"><label>Nombres</label><input type="text" class="form-control" name="nombres" id="nombres" required></div>
                        <div class="col-md-6 mb-3"><label>Apellidos</label><input type="text" class="form-control" name="apellidos" id="apellidos" required></div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3"><label>DUI</label><input type="text" class="form-control" name="dui" id="dui"></div>
                        <div class="col-md-4 mb-3"><label>NIT</label><input type="text" class="form-control" name="nit" id="nit"></div>
                        <div class="col-md-4 mb-3"><label>ISSS</label><input type="text" class="form-control" name="isss" id="isss"></div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3"><label>Fecha de Nacimiento</label><input type="date" class="form-control" name="fecha_nacimiento" id="fecha_nacimiento"></div>
                        <div class="col-md-4 mb-3"><label>Fecha de Ingreso</label><input type="date" class="form-control" name="fecha_ingreso" id="fecha_ingreso"></div>
                        <div class="col-md-4 mb-3"><label>Salario</label><input type="number" step="0.01" class="form-control" name="salario" id="salario" value="0"></div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3"><label>Género</label><select class="form-select" name="codigo_genero" id="selectGenero"></select></div>
                        <div class="col-md-4 mb-3"><label>Estado Civil</label><select class="form-select" name="codigo_estado_civil" id="selectEstadocivil"></select></div>
                        <div class="col-md-4 mb-3"><label>Estatus</label><select class="form-select" name="codigo_estatus" id="selectEstatus"></select></div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3"><label>Pago Diario</label><input type="number" step="0.01" class="form-control" name="pago_diario" id="pago_diario" value="0"></div>
                        <div class="col-md-4 mb-3"><label>Teléfono Celular</label><input type="text" class="form-control" name="telefono_celular" id="telefono_celular"></div>
                        <div class="col-md-4 mb-3"><label>Correo Electrónico</label><input type="email" class="form-control" name="correo_electronico" id="correo_electronico"></div>
                    </div>
                    <div class="row">
                        <div class="col-md-8 mb-3"><label>Dirección</label><textarea class="form-control" name="direccion" id="direccion" rows="2"></textarea></div>
                        <div class="col-md-4 mb-3"><label>Cargo</label><select class="form-select" name="codigo_cargo" id="selectCargo"></select></div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label>Departamento</label>
                            <select class="form-select" name="codigo_departamento" id="selectDepartamento"></select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label>Municipio</label>
                            <select class="form-select" name="codigo_municipio" id="selectMunicipio"></select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label>Distrito</label>
                            <select class="form-select" name="codigo_distrito" id="selectDistrito"></select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label>Institución</label>
                            <select class="form-select" name="codigo_institucion" id="selectInstitucion" required></select>
                        </div>
                    </div>
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg"><i class="fas fa-save me-2"></i> Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block javascripts %}
{{ parent() }}
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
<script src="./js/personal/Personal.js"></script>
{% endblock %}

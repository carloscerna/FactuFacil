{# views/mantenimiento_catalogo.html #}
{% extends 'default_layout.html' %}

{% block contenidos %}
<div class="container mt-5">
    <div class="card shadow-lg rounded-3">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center rounded-top-3">
            <h2 class="mb-0">Mantenimiento de Catálogos DTE</h2>
        </div>
        <div class="card-body p-4">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="selectCatalogo">Seleccionar Catálogo a Mantener</label>
                    <select class="form-select" id="selectCatalogo" name="tabla"></select>
                </div>
            </div>
            
            <hr>

            <div id="seccionTabla" style="display:none;">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0">Registros: <span id="tituloCatalogo"></span></h5>
                    <button class="btn btn-primary" id="btnNuevoRegistro" type="button" data-bs-toggle="modal" data-bs-target="#registroModal">
                        <i class="fas fa-plus-circle me-2"></i> Nuevo Registro
                    </button>
                </div>
                <table id="tablaRegistros" class="table table-striped table-hover table-bordered">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Código</th>
                            <th>Descripción</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="registroModal" tabindex="-1" aria-labelledby="registroModalLabel">
    <div class="modal-dialog">
        <div class="modal-content rounded-4 shadow-lg">
            <div class="modal-header bg-primary text-white rounded-top-4">
                <h5 class="modal-title" id="registroModalLabel">Formulario de Registro</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <form id="registroForm">
                    <input type="hidden" id="id_registro" name="id">
                    <input type="hidden" name="accion" value="crearActualizar">
                    <input type="hidden" id="tabla_nombre" name="tabla">

                    <div class="mb-3">
                        <label>Código</label>
                        <input type="text" class="form-control" name="codigo" id="codigo" required>
                    </div>
                    <div class="mb-3">
                        <label>Descripción</label>
                        <input type="text" class="form-control" name="descripcion" id="descripcion" required>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg"><i class="fas fa-save me-2"></i> Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block javascripts %}
{{ parent() }}
<script src="./js/mantenimiento.js"></script>
{% endblock %}

{# views/productos/Productos.html #}
{% extends 'default_layout.html' %}

{% block contenidos %}
<div class="container mt-5">
    <div class="card shadow-lg rounded-3">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center rounded-top-3">
            <h2 class="mb-0">Catálogo de Productos</h2>
            <button class="btn btn-light" id="btnNuevoProducto" type="button" data-bs-toggle="modal" data-bs-target="#productoModal">
                <i class="fas fa-plus-circle me-2"></i> Nuevo Producto
            </button>
        </div>
        <div class="card-body p-4">
            <table id="tablaProductos" class="table table-striped table-hover table-bordered">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Código Interno</th>
                        <th>Descripción</th>
                        <th>Categoría</th>
                        <th>Precio Venta</th>
                        <th>Existencia</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="productoModal" tabindex="-1" aria-labelledby="productoModalLabel">
    <div class="modal-dialog modal-xl">
        <div class="modal-content rounded-4 shadow-lg">
            <div class="modal-header bg-primary text-white rounded-top-4">
                <h5 class="modal-title" id="productoModalLabel">Formulario de Producto</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <form id="productoForm">
                    <input type="hidden" id="id_productos" name="id_productos">
                    <input type="hidden" name="accion" value="crearActualizar">

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label>Código Interno</label>
                            <input type="text" class="form-control" name="codigo_interno" id="codigo_interno" readonly value="Pendiente..." required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label>Descripción</label>
                            <input type="text" class="form-control" name="descripcion" id="descripcion" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label>Código de Barra</label>
                            <input type="text" class="form-control" name="codigo_barra" id="codigo_barra">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label>Categoría</label>
                            <select class="form-select" name="codigo_categoria" id="selectCategoria" required></select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label>Unidad de Medida</label>
                            <select class="form-select" name="unidad_medida" id="selectUnidadMedida" required></select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label>Tipo de Item</label>
                            <select class="form-select" name="tipo_item" id="selectTipoItem" required></select>
                        </div>
                    </div>
                     <div class="row">
                    <div class="col-md-4 mb-3">
                        <label>Impuesto Aplicable</label>
                        <select class="form-select" name="impuesto_aplicable" id="selectImpuesto" required></select>
                        <input type="hidden" name="tipo_impuesto" id="tipo_impuesto">
                        <input type="hidden" name="porcentaje_impuesto" id="porcentaje_impuesto">
                        <input type="hidden" name="monto_impuesto" id="monto_impuesto">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label>Precio Costo</label>
                        <input type="number" step="0.01" class="form-control" name="precio_costo" id="precio_costo" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label>Porcentaje Ganancia</label>
                        <select class="form-select" name="porcentaje_ganancia" id="selectGanancia" required></select>
                    </div>
                </div>
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label>Precio Venta (Calculado)</label>
                            <input type="number" step="0.01" class="form-control" name="precio_unitario" id="precio_unitario" readonly>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label>Existencia</label>
                            <input type="number" step="0.01" class="form-control" name="stock_actual" id="stock_actual">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label>Existencia Mínima</label>
                            <input type="number" step="0.01" class="form-control" name="stock_minimo" id="stock_minimo">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label>Fecha de Vencimiento</label>
                            <input type="date" class="form-control" name="fecha_vencimiento" id="fecha_vencimiento">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label>Comentario</label>
                        <textarea class="form-control" name="comentario" id="comentario" rows="2"></textarea>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg"><i class="fas fa-save me-2"></i> Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block javascripts %}
{{ parent() }}
<script src="./js/productos/Productos.js"></script>
{% endblock %}

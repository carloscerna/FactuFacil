{# views/ganancias/Ganancias.html #}
{% extends 'default_layout.html' %}

{% block contenidos %}
<div class="container mt-5">
    <div class="card shadow-lg rounded-3">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center rounded-top-3">
            <h2 class="mb-0">Gestión de Porcentajes de Ganancia</h2>
            <button class="btn btn-light" id="btnNuevaGanancia" type="button" data-bs-toggle="modal" data-bs-target="#gananciaModal">
                <i class="fas fa-plus-circle me-2"></i> Nuevo Porcentaje
            </button>
        </div>
        <div class="card-body p-4">
            <table id="tablaGanancias" class="table table-striped table-hover table-bordered">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Código</th>
                        <th>Descripción</th>
                        <th>Porcentaje</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="gananciaModal" tabindex="-1" aria-labelledby="gananciaModalLabel">
    <div class="modal-dialog">
        <div class="modal-content rounded-4 shadow-lg">
            <div class="modal-header bg-primary text-white rounded-top-4">
                <h5 class="modal-title" id="gananciaModalLabel">Formulario de Ganancia</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <form id="gananciaForm">
                    <input type="hidden" id="id_ganancia" name="id_ganancia">
                    <input type="hidden" name="accion" value="crearActualizar">

                    <div class="mb-3">
                        <label>Código</label>
                        <input type="text" class="form-control" name="codigo" id="codigo" readonly value="Pendiente..." required>
                    </div>
                    <div class="mb-3">
                        <label>Descripción</label>
                        <input type="text" class="form-control" name="descripcion" id="descripcion" required maxlength="50">
                    </div>
                    <div class="mb-3">
                        <label>Porcentaje (%)</label>
                        <input type="number" step="0.01" class="form-control" name="porcentaje" id="porcentaje" required>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg"><i class="fas fa-save me-2"></i> Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block javascripts %}
{{ parent() }}
<script src="./js/ganancias/Ganancias.js"></script>
{% endblock %}

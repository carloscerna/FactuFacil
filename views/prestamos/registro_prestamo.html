{# views/tesoreria/registro_prestamo.html #}
{% extends 'default_layout.html' %}

{% block contenidos %}
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Registrar Ingreso de Préstamo</h5>
        </div>
        <div class="card-body">
            <form id="formPrestamo">
                <input type="hidden" name="accion" value="guardar_prestamo">

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Prestamista (Acreedor)</label>
                        <select class="form-select" name="id_prestamista" id="selectPrestamista" required>
                            <option value="">Cargando...</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Monto Recibido</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" step="0.01" class="form-control" name="monto" required>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Fecha Ingreso</label>
                        <input type="date" class="form-control" name="fecha" value="{{ "now"|date("Y-m-d") }}" required>
                    </div>

                    <div class="col-md-8 mb-3">
                        <label class="form-label">¿Dónde ingresa el dinero?</label>
                        <div class="d-flex gap-3 p-2 border rounded bg-light">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="destino" id="optCaja" value="CAJA" checked>
                                <label class="form-check-label fw-bold" for="optCaja">
                                    <i class="fas fa-cash-register"></i> En Caja (Efectivo)
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="destino" id="optBanco" value="BANCO">
                                <label class="form-check-label fw-bold" for="optBanco">
                                    <i class="fas fa-university"></i> En Banco
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row d-none" id="bloqueBanco">
                    <div class="col-md-12 mb-3">
                        <label class="form-label">Seleccionar Cuenta Bancaria de Destino</label>
                        <select class="form-select" name="id_cuenta_banco" id="selectBanco">
                            <option value="">Seleccione cuenta...</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Concepto / Notas</label>
                    <textarea class="form-control" name="concepto" rows="2" placeholder="Ej: Préstamo para compra de mercadería..."></textarea>
                </div>

                <div class="text-end">
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save"></i> Guardar Ingreso
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block javascripts %}
{{ parent() }}
<script src="./js/tesoreria_prestamos.js"></script>
{% endblock %}

{% block estilos %}
{{ parent() }}
{% endblock %}

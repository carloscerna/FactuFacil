{# views/prestamos/catalogo_prestamistas.html #}
{% extends 'default_layout.html' %}

{% block contenidos %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3><i class="fas fa-users-cog"></i> Acreedores / Prestamistas</h3>
        <button class="btn btn-primary" onclick="abrirModal()">
            <i class="fas fa-plus"></i> Nuevo Prestamista
        </button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover table-bordered" id="tablaPrestamistas">
                    <thead class="table-light">
                        <tr>
                            <th>Nombre</th>
                            <th>Teléfono</th>
                            <th class="text-center" width="150">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyPrestamistas">
                        </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalPrestamista" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="tituloModal">Prestamista</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formPrestamista">
            <input type="hidden" name="id_prestamista" id="inputId">
            
            <div class="mb-3">
                <label class="form-label">Nombre o Entidad <span class="text-danger">*</span></label>
                <input type="text" class="form-control" name="nombre_prestamista" id="inputNombre" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Teléfono</label>
                <input type="text" class="form-control" name="telefono" id="inputTelefono">
            </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        <button type="button" class="btn btn-primary" onclick="guardarPrestamista()">Guardar</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block javascripts %}
{{ parent() }}
<script src="./js/prestamos/catalogo_prestamistas.js"></script>
{% endblock %}
